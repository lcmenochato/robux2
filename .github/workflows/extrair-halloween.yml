name: Corrigir caminhos do Kingdom Halloween
on:
  push:
    paths:
      - '.github/workflows/extrair-halloween.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corrigir links relativos e publicar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'<base\s+href=["\']https?://[^>]+>', '', s, flags=re.I)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Corrigir base href que apontava imagens para outro dominio"
            git push
          fi
