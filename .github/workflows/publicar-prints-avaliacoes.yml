name: Publicar prints da galeria Kingdom
on:
  push:
    paths:
      - 'prints-avaliacoes-kingdom.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair imagens enviadas
        run: |
          test -f prints-avaliacoes-kingdom.zip
          unzip -o prints-avaliacoes-kingdom.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/avaliacoes-cliente
          if ! git diff --cached --quiet; then
            git commit -m "Publicar prints da galeria de avaliações"
            git push
          fi
