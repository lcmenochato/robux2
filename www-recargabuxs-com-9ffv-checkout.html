<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout • Kingdom Robux Halloween</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c0c0d;color:#f7f7f7;font:16px system-ui,sans-serif;min-height:100vh}header{background:#151515;border-bottom:1px solid #3c3420;padding:19px;text-align:center}header h1{margin:0;color:#d4b458;font-size:25px}header small{color:#aaa}main{max-width:720px;margin:26px auto;padding:0 16px 40px}.panel{background:#111;border:1px solid #38332a;border-radius:15px;padding:24px;margin:18px 0}.panel h2{font-size:21px;margin:0 0 22px}label{display:block;margin:16px 0 7px;font-weight:600}input,select{width:100%;padding:14px;background:#242424;border:1px solid #494949;color:#fff;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;background:#cfaf53;color:#121212;font-size:16px;font-weight:800;padding:16px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.wide{width:100%;margin-top:17px}.outline{background:transparent;color:#eee;border:1px solid #b89c51}.muted{color:#999;font-size:14px}.price{color:#d5b452;font-size:28px;font-weight:800}.item{display:flex;gap:15px;align-items:center;padding:14px;background:#1c1c1c;border:1px solid #333;border-radius:12px}.item img{width:72px;height:90px;object-fit:cover;border-radius:8px}.item-main{flex:1;min-width:0}.item-title{font-weight:800}.qty{display:flex;align-items:center;gap:12px;margin-top:9px}.qty button{padding:6px 12px;background:#343434;color:#eee}.summary{display:flex;justify-content:space-between;margin:18px 0}.summary.total{padding-top:19px;border-top:1px solid #333;font-weight:800;font-size:22px}.coupon{display:flex;gap:8px}.coupon input{flex:1;min-width:0}.coupon button{background:#333;color:#ddd}.suggest{margin:34px 0;text-align:center;color:#d5b452;font-size:21px;font-weight:800}#pix{display:none;text-align:center}#qr{width:100%;max-width:235px;margin:14px auto}#code{word-break:break-all;font-size:13px}#error{color:#ff8585}a{color:#d5b452}@media(max-width:480px){.panel{padding:18px}.item img{width:64px;height:80px}}
</style></head><body><header><h1>🎃 Kingdom Robux</h1><small>CHECKOUT SEGURO • PIX</small></header><main>
<section id="details">
<div class="panel"><h2>Seus dados</h2><label for="username">Usuário Roblox</label><input id="username" autocomplete="off" placeholder="Seu usuário Roblox" maxlength="80"><label for="email">E-mail para contato (opcional)</label><input id="email" type="email" placeholder="seu@email.com"></div>
<div class="panel"><h2>Seus Produtos (1)</h2><div class="item"><img id="product-image" src="./images/kingdom-halloween/1200.png" alt="Pacote Robux"><div class="item-main"><div class="item-title" id="product-name">1.200 Robux</div><div class="price" id="item-price"></div><div class="qty"><span>Quantidade:</span><strong>1</strong></div></div></div><label for="product">Pacote selecionado</label><select id="product"><option value="1200">1.200 Robux — R$ 19,90</option><option value="1700">1.700 Robux — R$ 24,90</option><option value="2100">2.100 Robux — R$ 35,90</option><option value="3600">3.600 Robux — R$ 42,90</option><option value="4500">4.500 Robux — R$ 59,90</option><option value="7000">7.000 Robux — R$ 89,90</option><option value="10000">10.000 Robux — R$ 119,90</option></select></div>
<div class="panel"><h2>Resumo do Pedido</h2><div class="summary"><span class="muted">Subtotal:</span><span id="subtotal"></span></div><div class="summary total"><span>Total:</span><span id="price" class="price"></span></div><div class="coupon"><input placeholder="Código do cupom" aria-label="Código do cupom" id="coupon"><button type="button" id="apply-coupon">Aplicar</button></div><p id="coupon-note" class="muted" aria-live="polite"></p><button id="pay" class="wide">FINALIZAR COMPRA</button><a href="./index.html" class="wide outline" style="display:block;text-align:center;text-decoration:none;padding:16px;border-radius:10px;margin-top:14px;font-weight:800">CONTINUAR COMPRANDO</a></div>
</section>
<section id="pix" class="panel"><h2>Seu Pix está pronto</h2><div id="pixprice" class="price"></div><img id="qr" hidden alt="QR Code Pix"><p>Copie o código Pix abaixo:</p><div id="code"></div><button id="copy" class="wide">Copiar código Pix</button><p id="status">Aguardando confirmação do pagamento...</p><button id="back" type="button" class="wide outline">Voltar ao pedido</button></section><p id="error" role="alert"></p></main>
<script src="./js/flevopay-checkout.js"></script><script>
(function(){const images={1200:'1200',1700:'1700',2100:'2100',3600:'3600',4500:'4500',7000:'7000',10000:'10000'};const p=document.getElementById('product');function sync(){const id=p.value;document.getElementById('product-image').src='./images/kingdom-halloween/'+images[id]+'.png';document.getElementById('product-name').textContent=Number(id).toLocaleString('pt-BR')+' Robux';document.getElementById('item-price').textContent=document.getElementById('price').textContent;document.getElementById('subtotal').textContent=document.getElementById('price').textContent;}p.addEventListener('change',sync);sync();document.getElementById('apply-coupon').addEventListener('click',()=>{document.getElementById('coupon-note').textContent='Nenhum cupom disponível para este pedido.';});})();
</script></body></html>
